name: Storefront build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify book cover and sample files
        run: npm run check:assets
      - name: Verify publication and purchase-link safety
        run: npm run check:purchases
      - name: Build storefront
        run: npm run build
      - name: Verify generated site
        run: |
          test -s dist/index.html
          test -d dist/assets
