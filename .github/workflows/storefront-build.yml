name: Storefront build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-handoff.txt
      - name: Test private handoff validation
        run: python -m unittest discover -s tests -p 'test_wec_handoff.py' -v
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Simulate Cloudflare missing native Rollup package and verify repair
        run: |
          test -d node_modules/rollup
          rm -rf node_modules/@rollup/rollup-linux-x64-gnu
          npm run build
          node -e "require.resolve('@rollup/rollup-linux-x64-gnu')"
      - name: Verify release readiness
        run: npm run check:release
      - name: Validate Cloudflare Worker packaging without deployment
        run: npx wrangler deploy --dry-run --outdir /tmp/cozy-wrangler-dry-run
